# Основний конвеєр: збирає блог і публікує дописи, час яких настав.
# Працює щогодини, а також одразу після Merge у main.
name: Конвеєр контенту

on:
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "config.yml", "scripts/**"]
  schedule:
    - cron: "7,22,37,52 * * * *"   # кожні 15 хв: GitHub часто пропускає запуски за розкладом
  workflow_dispatch:              # надійний запуск кожні 15 хв дає Cloudflare Worker (tools/cron-worker)

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                  # найсвіжіший main, а не коміт, що запустив роботу (інакше журнал конфліктує)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: ffmpeg для моушн-відео
        timeout-minutes: 6          # apt на машинах GitHub іноді зависає
        continue-on-error: true
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: ffmpeg, запасний варіант (статична збірка з pip)
        run: |
          command -v ffmpeg && exit 0
          pip install -q imageio-ffmpeg
          mkdir -p "$HOME/bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Зібрати сторінки блогу і картинки
        run: python scripts/build_site.py

      - name: Видалити дописи з черги на заміну
        if: github.repository == 'SergiyBelyakov/belyakovconsult'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/delete_posts.py

      - name: Опублікувати дописи, час яких настав
        # Продакшн публікує за режимом із config.yml; тестовий репозиторій завжди лише в dry-run.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_PAGE_TOKEN: ${{ secrets.LINKEDIN_PAGE_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python scripts/publish.py ${{ github.repository != 'SergiyBelyakov/belyakovconsult' && '--dry-run' || '' }}

      - name: Зберегти сайт і журнал публікацій
        run: |
          OUT=$(python -c "import yaml;print(yaml.safe_load(open('config.yml'))['site']['output_dir'])")
          git config user.name "content-pipeline"
          git config user.email "content-pipeline@users.noreply.github.com"
          git add state "$OUT"
          if git diff --cached --quiet; then echo "Змін немає"; exit 0; fi
          git commit -m "Конвеєр: оновлення сайту і журналу $(date -u +'%Y-%m-%d %H:%M')"
          # -X theirs: при конфлікті в журналі чи картинках перемагає версія цього запуску (вона новіша)
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
