# Основний конвеєр: збирає блог і публікує дописи, час яких настав.
# Працює щогодини, а також одразу після Merge у main.
name: Конвеєр контенту

on:
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "config.yml", "scripts/**"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Зібрати сторінки блогу і картинки
        run: python scripts/build_site.py

      - name: Опублікувати дописи, час яких настав
        # Продакшн публікує за режимом із config.yml; тестовий репозиторій завжди лише в dry-run.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_PAGE_TOKEN: ${{ secrets.LINKEDIN_PAGE_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/publish.py ${{ github.repository != 'SergiyBelyakov/belyakovconsult' && '--dry-run' || '' }}

      - name: Зберегти сайт і журнал публікацій
        run: |
          OUT=$(python -c "import yaml;print(yaml.safe_load(open('config.yml'))['site']['output_dir'])")
          git config user.name "content-pipeline"
          git config user.email "content-pipeline@users.noreply.github.com"
          git add state "$OUT"
          if git diff --cached --quiet; then echo "Змін немає"; exit 0; fi
          git commit -m "Конвеєр: оновлення сайту і журналу $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
