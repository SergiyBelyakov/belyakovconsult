# Збір статистики дописів з усіх платформ (нічого не публікує). Запуск вручну: Actions → «Статистика дописів» → Run.
name: Статистика дописів

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"        # щопонеділка 07:17 за Києвом, перед щотижневим аналізом

permissions:
  contents: write

concurrency:
  group: stats-collect           # окрема черга: запуски конвеєра щочверть години її не витісняють
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'SergiyBelyakov/belyakovconsult'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Зібрати статистику
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python scripts/stats.py
      - name: Зберегти результат
        run: |
          git config user.name "content-pipeline"
          git config user.email "content-pipeline@users.noreply.github.com"
          git add state/stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Статистика $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done; exit 1
