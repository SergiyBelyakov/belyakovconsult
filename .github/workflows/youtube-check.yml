# Перевірка ключа YouTube (нічого не публікує). Запуск вручну: Actions → «Перевірка YouTube» → Run.
name: Перевірка YouTube

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-check           # окрема черга: запуски конвеєра щочверть години її не витісняють
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'SergiyBelyakov/belyakovconsult'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Перевірити ключ і канал
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python scripts/check_youtube.py
      - name: Зберегти результат
        run: |
          git config user.name "content-pipeline"
          git config user.email "content-pipeline@users.noreply.github.com"
          git add state/youtube-check.md
          git diff --cached --quiet && exit 0
          git commit -m "Перевірка YouTube $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done; exit 1
