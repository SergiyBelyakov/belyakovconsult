# Перевірка доступу до сторінки LinkedIn (нічого не публікує). Запуск вручну: Actions → «Перевірка LinkedIn» → Run.
name: Перевірка LinkedIn

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-check          # окрема черга: запуски конвеєра щочверть години її не витісняють
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'SergiyBelyakov/belyakovconsult'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Перевірити ключ і сторінку
        env:
          LINKEDIN_PAGE_TOKEN: ${{ secrets.LINKEDIN_PAGE_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python scripts/check_linkedin.py
      - name: Зберегти результат
        run: |
          git config user.name "content-pipeline"
          git config user.email "content-pipeline@users.noreply.github.com"
          git add state/linkedin-check.md
          git diff --cached --quiet && exit 0
          git commit -m "Перевірка LinkedIn $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
