# Ритм публікацій. Дописи на тему статті: posts/<канал>-<мова>.md (допис 1) і posts/<канал>-<мова>-N.md (2, 3…).
# Якщо в дописі немає publish_at, час рахується тут: дата статті + post_days[N] днів, о годині з times.
# Допис 1 іде з основним відео статті, дописи 2+ зі своїми відео з episodes у статті.
# Етап обирається за датою статті: перший, у якого until не раніше за дату статті.
cadence:
  times:
    telegram:     {uk: "10:00"}
    threads:      {uk: "12:00", en: "18:00"}
    instagram:    {uk: "12:30", en: "18:30"}
    linkedinpage: {uk: "13:30", en: "17:00"}   # найкращий час за Sprout Social і Buffer 2026 (будні, обід і після обіду)
    youtube:      {uk: "19:00", en: "20:30"}   # Shorts: вечірній пік перегляду (EN = 13:30 Нью-Йорк, 18:30 Лондон)
  # H1 (з 09.11.2026): Reels удень проти вечора. Пн, ср, пт, нд EN о 15:00 і UA о 14:00; вт, чт, сб як раніше.
  # Пікові вікна Threads за статистикою акаунта (2.11.2026, час київський): нд 8–11, сб 14–17, вт 17–20.
  # У ці дні допис до статті йде в пік, нотатки зсуваються (notes.times_by_weekday) щонайменше на 90 хв.
  times_by_weekday:
    instagram:
      mon: {uk: "14:00", en: "15:00"}
      wed: {uk: "14:00", en: "15:00"}
      fri: {uk: "14:00", en: "15:00"}
      sun: {uk: "14:00", en: "15:00"}
    threads:
      sun: {uk: "09:00", en: "10:30"}
      sat: {uk: "14:30", en: "16:00"}
      tue: {uk: "17:30", en: "19:00"}
  # Позапланові дописи (фан-ролики, «зараз»): найближчий кращий слот каналу, не раніше ніж за lead_minutes
  # від моменту планування і не ближче ніж gap_minutes до інших дописів каналу цією мовою. Див. scripts/next_slot.py.
  adhoc:
    lead_minutes: 60
    gap_minutes: 90
    active_hours: [8, 22]   # вікно для запасного слота, київський час
  # Правила каналу поверх ритму. LinkedIn: лише будні, не більше 2 дописів на день однією мовою,
  # щонайменше gap_minutes між дописами. Допис вихідних іде в найближчий будній день із вільним місцем
  # (додаткові слоти alt_times); допис, що збігся з явно заданим (publish_at), зсувається в межах свого дня.
  channel_rules:
    linkedinpage:
      weekdays_only: true
      max_per_day: 2
      gap_minutes: 90
      alt_times: {uk: ["11:00", "15:30"], en: ["15:00", "12:00"]}
  phases:
    # Запуск, три тижні (26.10–15.11): дві статті на тиждень і дописи щодня.
    # Стаття понеділка: дописи пн, вт, ср (3). Стаття четверга: чт, пт, сб, нд (4).
    - until: 2026-11-15
      article_weekdays: [mon, thu]
      post_days: {1: 0, 2: 1, 3: 2, 4: 3}
    # Основний ритм з 16.11: стаття щопонеділка, дописи пн, ср, пт.
    - article_weekdays: [mon]
      post_days: {1: 0, 2: 2, 3: 4}

# Короткі нотатки без статті: content/notes/<РРРР-ММ-ДД>/<канал>-<мова>-<слот>.md
# Threads: текстова гілка без відео. Instagram: карусель карток (cards у файлі нотатки).
# Час: дата папки, година зі слота нижче (слот = номер у назві файлу).
notes:
  # 07.11.2026 за статистикою (state/stats.json): у Threads 08:30 у середньому 2 перегляди, 21–22 год 28–47;
  # каруселі Instagram у 4 рази слабші за Reels. Гіпотези й метрики: EXPERIMENTS_UA.md.
  times:
    threads:   {uk: ["22:00", "20:30"], en: ["22:30", "21:00"]}   # en-N: переклад uk-N; ранкові слоти прибрано
    instagram: {uk: ["09:00"], en: ["17:00"]}     # карусель EN не збігається з Reels о 15:00 (H1)
  days:                 # у які дні виходять нотатки каналу (інші дні нотатки пропускаються)
    instagram: [mon, wed, fri]     # H3: каруселі 3 рази на тиждень замість щодня
  times_by_weekday:     # у дні піків Threads нотатки не перетинаються з дописом до статті
    threads:
      sun: {uk: ["11:00", "20:30"], en: ["12:30", "21:00"]}
      sat: {uk: ["11:00", "20:30"], en: ["17:30", "21:00"]}

# Додаткові посилання для дописів: {{<ключ>}} у тексті → сторінка сайту мовою допису з UTM-міткою каналу
