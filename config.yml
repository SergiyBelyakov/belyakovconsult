# Налаштування конвеєра Belyakov Consult.
# Усе, що можна змінювати без програмування, зібрано тут.

# dry-run — нічого не публікується в соцмережі, лише пишеться в журнал і приходить у Telegram-адмінку.
# live    — справжня публікація. Перемикайте після перевірки першого тижня.
mode: dry-run

# Канали, які публікуються по-справжньому навіть у режимі dry-run.
# Додавайте мережу сюди, коли її ключі налаштовані й перевірені.
live_channels: [telegram]   # LinkedIn перевірено 25.10; додати linkedin, коли вирішите публікувати автоматично

timezone: Europe/Kyiv

# Якщо допис «прострочений» більше ніж на стільки годин (наприклад, конвеєр був вимкнений),
# його не публікуємо автоматично, а надсилаємо нагадування.
max_late_hours: 48

