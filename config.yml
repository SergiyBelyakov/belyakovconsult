# Налаштування конвеєра Belyakov Consult.
# Усе, що можна змінювати без програмування, зібрано тут.

# dry-run — нічого не публікується в соцмережі, лише пишеться в журнал і приходить у Telegram-адмінку.
# live    — справжня публікація. Перемикайте після перевірки першого тижня.
